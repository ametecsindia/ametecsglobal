<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Ametecs Global</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7C77A"/>
      <stop offset=".55" stop-color="#C9A24A"/>
      <stop offset="1" stop-color="#9C7A2E"/>
    </linearGradient>
    <clipPath id="front"><rect x="0" y="300" width="512" height="212"/></clipPath>
    <clipPath id="cut"><rect x="120" y="300" width="272" height="212"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="116" fill="#14120D"/>
  <!-- orbit, back half -->
  <g transform="rotate(-16 256 300)">
    <ellipse cx="256" cy="300" rx="168" ry="52" fill="none" stroke="url(#g)" stroke-width="18"/>
  </g>
  <!-- the A, cut out of the orbit -->
  <path d="M150 396 L256 118 L362 396" fill="none" stroke="#14120D" stroke-width="76" stroke-linejoin="round"/>
  <path d="M150 396 L256 118 L362 396" fill="none" stroke="url(#g)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- orbit, front half passes over the A -->
  <g transform="rotate(-16 256 300)" clip-path="url(#front)">
    <ellipse cx="256" cy="300" rx="168" ry="52" fill="none" stroke="#14120D" stroke-width="34" clip-path="url(#cut)"/>
    <ellipse cx="256" cy="300" rx="168" ry="52" fill="none" stroke="url(#g)" stroke-width="18"/>
  </g>
  <!-- satellite -->
  <circle cx="417" cy="254" r="17" fill="#E7C77A"/>
</svg>
